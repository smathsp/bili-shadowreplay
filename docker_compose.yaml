name: bili-shadowreplay

services:
  bili-shadowreplay:
    image: ${BILI_SHADOWREPLAY_IMAGE:-ghcr.io/smathsp/bili-shadowreplay:latest}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # The Web API has no built-in authentication, so keep it local by default.
      # Set BSR_BIND_ADDRESS=0.0.0.0 only for a trusted LAN or an authenticated proxy.
      - "${BSR_BIND_ADDRESS:-127.0.0.1}:${BSR_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./output:/app/output
      # Put optional Whisper model files here, then select /app/models/<file> in Settings.
      - ./models:/app/models
    environment:
      DATA_DIR: /app/data
      CONFIG_PATH: /app/data/config.toml
      CACHE_DIR: /app/cache
      OUTPUT_DIR: /app/output
      LOG_DIR: /app/data/logs
      TZ: ${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
